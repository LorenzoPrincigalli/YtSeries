<!DOCTYPE html>
<html lang="en" data-theme="classic-red">
<head>
  <meta charset="utf-8">
  <title>YT Series</title>
  <link rel="stylesheet" href="../tab/variables.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <img src="../../icons/icon48.png" alt="">
    <h1>YT Series</h1>
    <span id="syncDot" class="sync-dot hidden" role="img" aria-label="Cloud sync"></span>
  </div>
  <p id="syncHint" class="sync-hint hidden" role="status"></p>
  <p id="loadError" class="error-note hidden" role="alert" data-i18n="popup_load_error">Could not load your library.</p>
  <div class="stats" aria-live="polite">
    <div class="stat">
      <div class="stat-num" id="seriesCount">—</div>
      <div class="stat-label" data-i18n="popup_series">Series</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="unwatchedCount">—</div>
      <div class="stat-label" data-i18n="popup_unwatched">Unwatched</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="newCount">—</div>
      <div class="stat-label" data-i18n="popup_new">New</div>
    </div>
  </div>
  <button type="button" class="btn btn-primary" id="openDashboard" data-i18n="popup_open_dashboard">Open Dashboard</button>
  <button type="button" class="btn btn-secondary" id="openSettings" data-i18n="settings">Settings</button>
  <button type="button" class="btn btn-secondary" id="supportBtn" data-i18n="support_cta">Support ☕</button>
  <script type="module" src="popup.js"></script>
</body>
</html>
