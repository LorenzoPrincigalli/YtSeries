<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .header img { width: 32px; height: 32px; border-radius: 4px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .stats { display: flex; gap: 12px; margin-bottom: 16px; }
    .stat {
      flex: 1;
      background: #1a1a1a;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-num { font-size: 22px; font-weight: 700; color: #ff0000; }
    .stat-label { font-size: 11px; color: #aaaaaa; margin-top: 2px; }
    .btn-pro {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      color: #fff;
    }
    .btn-pro:hover { opacity: 0.9; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      margin-bottom: 8px;
    }
    .btn-primary { background: #ff0000; color: #fff; }
    .btn-secondary { background: #212121; color: #f1f1f1; }
    .btn:hover { opacity: 0.85; }
    .footer { font-size: 10px; color: #555; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <img src="../../icons/icon48.png" alt="">
    <h1>YT Series</h1>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="seriesCount">—</div>
      <div class="stat-label">Series</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="unwatchedCount">—</div>
      <div class="stat-label">Unwatched</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="newCount">—</div>
      <div class="stat-label">New</div>
    </div>
  </div>
  <button class="btn btn-primary" id="openDashboard">Open Dashboard</button>
  <button class="btn btn-secondary" id="openSettings">Settings</button>
  <button class="btn-pro" id="buyProBtn" style="display:none">Get Pro — €4.99</button>
  <div class="footer" id="proBadge"></div>
  <script src="popup.js"></script>
</body>
</html>
