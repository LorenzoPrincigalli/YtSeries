<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#ddd"/>
    </linearGradient>
  </defs>

  <!-- TV Body -->
  <rect x="6" y="20" width="102" height="76" rx="10" ry="10" fill="url(#bg)" stroke="#ccc" stroke-width="2"/>

  <!-- TV Screen -->
  <rect x="14" y="28" width="86" height="54" rx="4" ry="4" fill="url(#screen)"/>

  <!-- Stand -->
  <rect x="48" y="96" width="18" height="10" rx="3" ry="3" fill="#ccc"/>
  <rect x="38" y="104" width="38" height="5" rx="3" ry="3" fill="#d5d5d5"/>

  <!-- Power LED -->
  <circle cx="110" cy="64" r="4" fill="#cc0000"/>

  <!-- Play Triangle -->
  <polygon points="46,44 46,66 64,55" fill="#cc0000"/>

  <!-- Screen Glow -->
  <rect x="90" y="32" width="6" height="46" rx="2" fill="url(#bg)" opacity="0.2"/>

  <!-- Series List Lines -->
  <line x1="24" y1="40" x2="48" y2="40" stroke="#999" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="48" x2="56" y2="48" stroke="#999" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="56" x2="42" y2="56" stroke="#999" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="64" x2="52" y2="64" stroke="#999" stroke-width="2" stroke-linecap="round"/>

  <!-- Badge -->
  <circle cx="104" cy="24" r="8" fill="#cc0000"/>
  <circle cx="104" cy="24" r="6" fill="#b30000"/>
  <text x="104" y="27" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold" font-family="sans-serif">N</text>
</svg>
